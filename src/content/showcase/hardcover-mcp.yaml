name: "Hardcover MCP"
slug: "hardcover-mcp"
summary: "MCP server exposing your Hardcover library, reviews and progress to any LLM client"
description: |
  An MCP (Model Context Protocol) server that wraps Hardcover's GraphQL API, so any MCP-compatible LLM client — Claude, or others — can answer questions about your reading life, or use it as real personal context for something else you're building (a blog automation, a yearly reading recap, whatever).

  It's a thin wrapper: no database, no server to host, just a stdio process your MCP client launches with your own API token.

  Features:
  - Get your currently-reading books with page progress
  - List your library filtered by status (want to read, reading, read, paused, DNF)
  - Recently-read books, most recent first
  - Pull your own written reviews and ratings
  - Browse your Hardcover lists and the books inside them
  - Check your reading goal and current progress
  - Search Hardcover's catalog and get book details by id or slug
  - Automatic retry with backoff on rate limits
  - Works with Claude Code, Claude Desktop, or any MCP-compatible client


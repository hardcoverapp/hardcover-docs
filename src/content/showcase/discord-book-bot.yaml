name: "Discord BookBot"
slug: "discord-book-bot"
summary: "Discord bot that answers {book title} in chat with book info and links from Hardcover"
description: |
  Talking about books on Discord? Put a book title or title+author in curly braces, like {The Everlasting} or {Charlotte's Reject by KR Treadway}, and BookBot will reply with info and links from Hardcover. You can also use the /book command to summon book info directly.

  To install BookBot to a server or your account, click the "Add to Discord" link below. On a server, it will respond to all messages with {...}. On your account, curly braces won't work, but you can use the /book command anywhere, even in private DMs.

  Features:
  - Mention up to five books in one message and get a single reply
  - Editing a message updates its reply
  - Replies can be deleted with the Delete button, either by the person who asked or a moderator
  - If the wrong book is found, use the "Wrong book?" button to privately select a different match from Hardcover
  - Replies never ping anyone


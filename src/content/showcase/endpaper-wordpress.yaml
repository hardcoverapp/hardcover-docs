name: "Endpaper for WordPress"
slug: "endpaper-wordpress"
summary: "Show books, shelves and reading goals from Hardcover on your WordPress site."
description: |
  Endpaper is a free, unofficial WordPress plugin that brings your reading life from Hardcover to your own site, as blocks in the editor.

  - **Book:** embed any book with its cover, description, rating and facts. Optionally add your own rating, shelf, progress or review.
  - **Reading List:** show a shelf, like what you're currently reading, as a list or a grid of covers.
  - **Reading Goal:** show your progress on a public Hardcover goal as a gauge or a progress bar.

  The blocks inherit the typography and colors of your theme. Data from Hardcover is cached on your server and covers are saved on your own site, so visitors' browsers don't contact Hardcover.


name: "Readest"
slug: "readest"
summary: "Open-source ebook reader for every platform that syncs progress and notes to Hardcover"
description: |
  Readest is a free, open-source ebook reader for macOS, Windows, Linux, iOS, iPadOS, Android and the web. It opens EPUB, PDF, MOBI, AZW3, FB2, CBZ, TXT and Markdown, and sends what you read to Hardcover.

  Hardcover sync:
  - Sign in with your Hardcover account, no API token to copy
  - Sends reading progress as pages read, or as time listened when your Hardcover read is on an audiobook edition
  - Adds the book to your Hardcover library as Currently Reading and marks it Read when you finish
  - Sends highlights as quotes and notes as journal entries, with your account's default privacy, and updates entries already on Hardcover instead of duplicating them
  - Auto Sync while you read, or push progress and notes yourself from the book menu
  - Matches books by ISBN, then by title and author; Link Book lets you pick the Hardcover book when the match is wrong
  - Follows Hardcover's API rate limits

  Hardcover sync is free. Turn it on in Settings → Integrations → Hardcover.


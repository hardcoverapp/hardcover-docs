name: "Atrium"
slug: "atrium"
summary: "One library for your books, movies, TV, anime, games and manga, with Hardcover sync"
description: |
  Atrium is a web app (installable on iPhone and Android) for keeping everything you read, watch and play in one library. Books sit next to movies, shows, anime, games and manga, with the same statuses, ratings, stats and year in review.

  Free to use. One connected app syncs automatically for free, so a free account can keep Hardcover in sync every day; Atrium Pro syncs all of them.

  How Atrium uses Hardcover:
  - **Hardcover sync:** sign in with Hardcover (OAuth, read-only scopes) and the books you shelve there arrive in Atrium every day with their status, rating and finish date. Atrium never writes to your Hardcover account and never reads reviews, journals or lists.
  - **Hardcover import:** upload your Hardcover CSV export and every book matches directly by its Hardcover book id, no guessing.
  - **Book catalogue:** search, book pages, series order and upcoming releases come from Hardcover's catalogue, with the Hardcover reader rating shown and linked to the book on Hardcover.
  - **Goodreads imports matched through Hardcover:** Goodreads ids are mapped to Hardcover books in batches, so a Goodreads export lands on the right editions.

  Also in Atrium:
  - Works on phones: install it on your iPhone or Android home screen as an app (PWA), no app store needed
  - Imports from Goodreads, StoryGraph, Letterboxd, MyAnimeList, AniList, Steam, Trakt and more
  - Reading stats and insights, plus a shareable year-in-review recap
  - Up Next and an upcoming-releases calendar
  - Free export of your whole library, always

  Atrium respects the API's rate limits (per-token pacing that reads the RateLimit headers), sends a descriptive User-Agent, and only reads a person's Hardcover library on their behalf after they sign in.


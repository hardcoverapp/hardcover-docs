name: "MyNextBook"
slug: "mynextbook"
summary: "Book recommendation site with \"books like X\" pages and genre best-of lists"
description: |
  MyNextBook is a book recommendation website, free to browse. Pick a book you liked and it suggests similar reads, or browse ranked best-of lists by genre.

  It uses the Hardcover GraphQL API for book metadata: covers, descriptions, page counts, publication years, and each book's aggregate rating and rating count. Hardcover ratings are always labelled as Hardcover data (for example "4.29 (5.1K ratings on Hardcover)"). Only book-level aggregates are used, never an individual reader's rating or review.

  Features:
  - "Books like X" pages with similar-book picks for thousands of titles
  - Best-of lists by genre (fantasy, science fiction, romance, mystery and more)
  - Covers, descriptions and average Hardcover ratings on book cards
  - Open Library as a fallback source when Hardcover has no rating, labelled as such


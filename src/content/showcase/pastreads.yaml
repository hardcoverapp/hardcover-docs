name: "PastReads"
slug: "pastreads"
summary: "Sync and organize highlights from Kindle, Kobo, Apple Books and more, with book data from Hardcover"
description: |
  PastReads is a personal library for book highlights. Import from Kindle, Kobo, Apple Books, Google Play Books, KOReader, physical books (via photo), and more. Then edit, organize, favorite, tag, add notes, and revisit highlights with daily reviews.

  How PastReads uses Hardcover:
  - **Book metadata:** e-reader exports often include incomplete book metadata, so PastReads matches each book to Hardcover to fill in its title, authors and cover
  - **Book search:** search and add books manually, with results from Hardcover and the option to pick a cover from any edition of a work

  Also in PastReads:
  - Apps for iPhone and Android, a web library, and a Chrome extension for highlighting web pages
  - Desktop sync for macOS and Windows that imports from Kindle, Kobo and Apple Books
  - Imports from Readwise, websites and YouTube
  - Free plan with unlimited uploads, highlights and notes; PastReads Pro is a paid upgrade


name: "JustRead"
slug: "justread"
summary: "EPUB, PDF, comic and audiobook reader for iPhone and iPad with two-way Hardcover sync"
description: |
  JustRead is an ebook and audiobook reader for iPhone and iPad. It connects to Hardcover with your API token and keeps your reading in step both ways.

  Features:
  - Pushes status (Want to Read, Currently Reading, Read, Did Not Finish), progress, start and finish dates, and your rating
  - Pulls status and rating changes made on Hardcover back into the app
  - Matches books by ISBN automatically, with a picker when no match is found
  - Shows the Hardcover community rating on a book's details
  - Optionally pushes your review text
  - Hardcover sync is free, no subscription needed

  Requires iOS 18.1 or later.


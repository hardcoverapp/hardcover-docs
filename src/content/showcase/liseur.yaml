name: "Liseur"
slug: "liseur"
summary: "Open-source Android EPUB reader that reports your reading to Hardcover"
description: |
  Liseur is a free, open-source EPUB reader and remote library client for Android, with a Kindle-inspired reading experience. It has no ads and no account of its own.

  With a Hardcover API token, Liseur can tell Hardcover what you are reading:
  - Reports reading status, progress, and start and finish dates as you read, either automatically when you close a book or with Push to Hardcover from the reader menu
  - Syncs ratings and reviews both ways
  - Matches each book to a Hardcover edition, with a full-screen edition picker that searches by title or ISBN
  - Fills in book details such as publisher, publication date and genres from Hardcover with Update from Hardcover
  - Sync can be turned off for a single book

  Reading features:
  - Library with shelves, series, a home screen and a cover grid
  - Reading statistics, highlights, notes, dictionary lookup and read aloud
  - Reading companion with character profiles and a map of character relationships
  - Connects to OPDS servers such as Calibre-Web and Komga

  Hardcover sync is in the Google Play build of the app. The F-Droid and GitHub builds don't include it.


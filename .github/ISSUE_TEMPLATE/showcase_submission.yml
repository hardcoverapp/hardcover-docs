name: Submit a project to the showcase
description: Add something you built with the Hardcover API to the community showcase, no coding or pull request needed.
title: "[Showcase]: "
labels: ["showcase"]
body:
  - type: markdown
    attributes:
      value: |
        Built something with the Hardcover API? Fill this out and we'll add it to the [community showcase](https://docs.hardcover.app/showcase/) for you.

        Comfortable with GitHub? You can also [open a pull request](https://docs.hardcover.app/showcase/submit/) yourself.
  - type: input
    id: name
    attributes:
      label: Project name
    validations:
      required: true
  - type: input
    id: summary
    attributes:
      label: One-line summary
      description: A short description shown on the showcase card. Under 100 characters.
      placeholder: Syncs your e-reader progress to Hardcover
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What does your project do, what are its main features, and how does it use Hardcover?
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Your name
      description: How you'd like to be credited.
    validations:
      required: true
  - type: input
    id: hardcover
    attributes:
      label: Your Hardcover username
      description: Please give at least one of your Hardcover or GitHub usernames.
  - type: input
    id: github
    attributes:
      label: Your GitHub username
  - type: textarea
    id: links
    attributes:
      label: Links
      description: Where can people find your project? Website, app store page, source code, docs. One per line.
      placeholder: |
        https://example.com
        https://apps.apple.com/app/...
    validations:
      required: true
  - type: dropdown
    id: categories
    attributes:
      label: Categories
      description: Pick everything that fits.
      multiple: true
      options:
        - Mobile App
        - Desktop App
        - Web App
        - Browser Extension
        - CLI Tool
        - Widget
        - E-ink Display
        - Home Automation
        - Integration
        - Automation
        - Other
    validations:
      required: true
  - type: dropdown
    id: features
    attributes:
      label: What it does with Hardcover
      description: Pick everything that fits. See the [feature list](https://docs.hardcover.app/showcase/submit/#features) for more on each one.
      multiple: true
      options:
        - Hardcover app (readers update their Hardcover library from it)
        - Progress sync (reading in another app or device is sent to Hardcover)
        - Two-way sync (also pulls changes made on Hardcover back)
        - Library sync (keeps a library in another app in step with Hardcover)
        - Import
        - Reading stats
        - Goals
        - Journal
        - Reviews
        - Lists
        - Notes
        - Dashboard
        - Discovery
        - Recommendations
        - Release tracking
        - Book data (looks up or shows Hardcover book data)
        - Librarian tools
        - Developer tools (made for developers, like client libraries)
        - AI assistant
    validations:
      required: true
  - type: dropdown
    id: connects
    attributes:
      label: How it connects to Hardcover
      description: Pick everything that fits.
      multiple: true
      options:
        - Uses the Hardcover API directly
        - Uses the Hardcover SDK
        - Readers sign in with their Hardcover account (OAuth)
        - Readers paste a personal API token
        - Reads a Hardcover CSV export
        - Only uses Hardcover's book data (no reader accounts)
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      description: Where it runs or what it plugs into.
      multiple: true
      options:
        - iOS
        - iPadOS
        - Android
        - macOS
        - Windows
        - Linux
        - Web
        - Chrome
        - Firefox
        - Terminal
        - Kindle
        - Kobo
        - KOReader
        - Smartwatch
        - TRMNL
        - Obsidian
        - Audiobookshelf
        - MCP
        - Self-hosted
  - type: dropdown
    id: formats
    attributes:
      label: Formats
      description: Only if it handles specific formats. Leave empty if it works the same for any book.
      multiple: true
      options:
        - Print
        - Ebook
        - Audiobook
  - type: input
    id: missing
    attributes:
      label: Anything we're missing?
      description: A platform, feature or format that isn't listed above.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: |
        Drag and drop your screenshots here, best one first. Landscape images around 1600x1000 work best. See the [screenshot tips](https://docs.hardcover.app/showcase/submit/#screenshot-tips).
  - type: checkboxes
    id: confirm
    attributes:
      label: Before you submit
      options:
        - label: My project uses the Hardcover API.
          required: true
        - label: My project is publicly available for people to use.
          required: true
        - label: I made this project or have permission to submit it.
          required: true
